targets:
  MovieBrowser:
    type: application
    platform: iOS
    sources:
      - path: MovieBrowser
        excludes:
          - "**/Info.plist"
      - path: MovieBrowser/Supporting/Info.plist
        buildPhase: "none"
    info:
      path: MovieBrowser/Supporting/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        TMDB_SSL_PINNING_KEY: $(TMDB_SSL_PINNING_KEY)
        TMDB_API_KEY: $(API_KEY)
        TMDB_API_TOKEN: $(API_TOKEN)
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MovieBrowser/Supporting/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        ENABLE_PREVIEWS: YES
        PRODUCT_NAME: "$(TARGET_NAME)"
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: "6.0.3"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    configFiles:
      Debug: MovieBrowser/Supporting/Configs/Debug.xcconfig
      Release: MovieBrowser/Supporting/Configs/Release.xcconfig
    dependencies:
      - package: Core
    postBuildScripts:
      - path: Scripts/lint.sh
        name: "[Run] SwiftLint"
        basedOnDependencyAnalysis: false
      - path: Scripts/format.sh
        name: "[Run] SwiftFormat"
        basedOnDependencyAnalysis: false

  MovieBrowserTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MovieBrowserTests
    dependencies:
      - target: MovieBrowser
    settings:
      GENERATE_INFOPLIST_FILE: YES
      BUNDLE_LOADER: "$(TEST_HOST)"
      CODE_SIGN_STYLE: Automatic
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: "1.0"
      PRODUCT_NAME: "$(TARGET_NAME)"
      STRING_CATALOG_GENERATE_SYMBOLS: NO
      SWIFT_APPROACHABLE_CONCURRENCY: YES
      SWIFT_EMIT_LOC_STRINGS: NO
      SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
      SWIFT_VERSION: "6.0.3"
      TARGETED_DEVICE_FAMILY: "1,2"
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MovieBrowser.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MovieBrowser"
    postBuildScripts:
      - path: Scripts/lint.sh
        name: "[Run] SwiftLint"
        basedOnDependencyAnalysis: false
      - path: Scripts/format.sh
        name: "[Run] SwiftFormat"
        basedOnDependencyAnalysis: false

  MovieBrowserUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MovieBrowserUITests
    dependencies:
      - target: MovieBrowser
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: "1.0"
      PRODUCT_NAME: "$(TARGET_NAME)"
      STRING_CATALOG_GENERATE_SYMBOLS: NO
      SWIFT_APPROACHABLE_CONCURRENCY: YES
      SWIFT_EMIT_LOC_STRINGS: NO
      SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
      SWIFT_VERSION: "6.0.3"
      TARGETED_DEVICE_FAMILY: "1,2"
      TEST_TARGET_NAME: MovieBrowser
    postBuildScripts:
      - path: Scripts/lint.sh
        name: "[Run] SwiftLint"
        basedOnDependencyAnalysis: false
      - path: Scripts/format.sh
        name: "[Run] SwiftFormat"
        basedOnDependencyAnalysis: false
